<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chess Wars · Unit Review</title>
<style>
  :root { --bg: #121722; --panel: rgba(16, 20, 30, 0.82); --line: rgba(255, 255, 255, 0.12); --text: #e9e4d8; --dim: #9a9fae; --gold: #e0b84f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  canvas { display: block; touch-action: none; }
  header { position: fixed; top: 0; left: 0; right: 0; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: linear-gradient(var(--panel), transparent); }
  header h1 { font-size: 16px; margin: 0 8px 0 0; letter-spacing: 0.04em; color: var(--gold); }
  .chips, .clips { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; min-height: 40px; }
  button.on { background: var(--gold); color: #1b1608; border-color: var(--gold); font-weight: 600; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; align-items: center; background: linear-gradient(transparent, var(--panel)); }
  #info { color: var(--dim); font-size: 13px; text-align: center; }
  #info b { color: var(--text); }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--dim); pointer-events: none; }
</style>
</head>
<body>
<header>
  <h1>UNIT REVIEW</h1>
  <div class="chips" id="units"></div>
</header>
<footer>
  <div class="clips" id="clips"></div>
  <div id="info"></div>
</footer>
<div id="loading">Loading units…</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }

  { id: "asgard-queen", group: "Queens", file: "export/Asgard_Queen.glb", name: "Valkyrie", army: "Asgardians", side: "Ivory" },
  { id: "machines-queen", group: "Queens", file: "export/Machines_Queen.glb", name: "Annihilator", army: "Machine Legion", side: "Onyx" },
  { id: "mafia-queen", group: "Queens", file: "export/Mafia_Queen.glb", name: "Underboss", army: "The Mafia", side: "Ivory" },
  { id: "knights-bishop", group: "Bishops", file: "export/Knights_Bishop.glb", name: "Templar", army: "Order of Knights", side: "Ivory" },
  { id: "undead-bishop", group: "Bishops", file: "export/Undead_Bishop.glb", name: "Necromancer", army: "Army of the Dead", side: "Onyx" },
  { id: "marines-bishop", group: "Bishops", file: "export/Marines_Bishop.glb", name: "Sniper", army: "Marines", side: "Ivory" },

  { id: "samurai-bishop", group: "Bishops", file: "export/Samurai_Bishop.glb", name: "Ninja", army: "Samurai Clans", side: "Ivory" },
  { id: "spartans-bishop", group: "Bishops", file: "export/Spartans_Bishop.glb", name: "Oracle", army: "Spartans", side: "Onyx" },
  { id: "asgard-bishop", group: "Bishops", file: "export/Asgard_Bishop.glb", name: "Thunderer", army: "Asgardians", side: "Ivory" },

  { id: "undead-rook", group: "Rooks", file: "export/Undead_Rook.glb", name: "Crypt", army: "Army of the Dead", side: "Onyx" },
  { id: "marines-rook", group: "Rooks", file: "export/Marines_Rook.glb", name: "Bunker", army: "Marines", side: "Ivory" },
  { id: "vikings-rook", group: "Rooks", file: "export/Vikings_Rook.glb", name: "Longship", army: "Vikings", side: "Onyx" },
  { id: "samurai-rook", group: "Rooks", file: "export/Samurai_Rook.glb", name: "Pagoda", army: "Samurai Clans", side: "Ivory" },
  { id: "spartans-rook", group: "Rooks", file: "export/Spartans_Rook.glb", name: "Watchtower", army: "Spartans", side: "Onyx" },
  { id: "asgard-rook", group: "Rooks", file: "export/Asgard_Rook.glb", name: "Bifrost Gate", army: "Asgardians", side: "Ivory" },
  { id: "machines-rook", group: "Rooks", file: "export/Machines_Rook.glb", name: "Turret", army: "Machine Legion", side: "Onyx" },
  { id: "mafia-rook", group: "Rooks", file: "export/Mafia_Rook.glb", name: "Speakeasy", army: "The Mafia", side: "Ivory" },
  { id: "knights-knight", group: "Knights", file: "export/Knights_Knight.glb", name: "Paladin", army: "Order of Knights", side: "Ivory" },
  { id: "undead-knight", group: "Knights", file: "export/Undead_Knight.glb", name: "Dire Wolf", army: "Army of the Dead", side: "Onyx" },
  { id: "marines-knight", group: "Knights", file: "export/Marines_Knight.glb", name: "Jeep", army: "Marines", side: "Ivory" },
  { id: "vikings-knight", group: "Knights", file: "export/Vikings_Knight.glb", name: "War Bear", army: "Vikings", side: "Onyx" },
  { id: "samurai-knight", group: "Knights", file: "export/Samurai_Knight.glb", name: "Samurai Cavalry", army: "Samurai Clans", side: "Ivory" },
  { id: "spartans-knight", group: "Knights", file: "export/Spartans_Knight.glb", name: "War Lion", army: "Spartans", side: "Onyx" },
  { id: "asgard-knight", group: "Knights", file: "export/Asgard_Knight.glb", name: "Sleipnir", army: "Asgardians", side: "Ivory" },
  { id: "machines-knight", group: "Knights", file: "export/Machines_Knight.glb", name: "Mech Hound", army: "Machine Legion", side: "Onyx" },
  { id: "mafia-knight", group: "Knights", file: "export/Mafia_Knight.glb", name: "Getaway Car", army: "The Mafia", side: "Ivory" },
];
const GROUPS = [...new Set(UNITS.map(u => u.group))];
const CLIPS = ["Idle", "Walk", "Attack", "Shoot", "Death", "Behead"];

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x121722);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.6;

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 1.2;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.49;

scene.add(new THREE.HemisphereLight(0xcfd8ff, 0x3b3228, 1.1));
const sun = new THREE.DirectionalLight(0xfff1dc, 2.6);
sun.position.set(-3, 6, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4 });
scene.add(sun);
const rim = new THREE.DirectionalLight(0x9fc4ff, 1.4);
rim.position.set(2, 3, -5);
scene.add(rim);

// a patch of chessboard, same square size as the game (1.2)
for (let i = -3; i < 3; i++) for (let j = -2; j < 2; j++) {
  const sq = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 1.2),
    new THREE.MeshStandardMaterial({ color: (i + j) % 2 === 0 ? 0x9c8a68 : 0x3b3228, roughness: 0.8 }));
  sq.rotation.x = -Math.PI / 2;
  sq.position.set(i * 1.2 + 0.6, 0, j * 1.2 + 0.6);
  sq.receiveShadow = true;
  scene.add(sq);
}

const loader = new GLTFLoader();
const loaded = new Map();   // id -> { root, mixer, actions }
let selection = "group:" + GROUPS[GROUPS.length - 1];  // newest group first
let clip = "Idle";

async function load(unit) {
  const gltf = await loader.loadAsync(unit.file);
  const root = gltf.scene;
  root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  const mixer = new THREE.AnimationMixer(root);
  const actions = {};
  for (const name of CLIPS) {
    const c = gltf.animations.find(a => a.name.endsWith(name));
    if (c) actions[name] = mixer.clipAction(c);
  }
  scene.add(root);
  return { root, mixer, actions };
}

function play(name) {
  clip = name;
  for (const { actions } of loaded.values()) {
    const next = actions[name];
    if (!next) continue;
    for (const a of Object.values(actions)) if (a !== next) a.fadeOut(0.2);
    const once = name !== "Idle" && name !== "Walk";
    next.reset().setLoop(once ? THREE.LoopOnce : THREE.LoopRepeat, Infinity);
    next.clampWhenFinished = name === "Death" || name === "Behead";
    next.fadeIn(0.2).play();
  }
  renderButtons();
}

// After an attack finishes, settle back into idle.
function hookAttackReturn(entry) {
  entry.mixer.addEventListener("finished", e => {
    if (e.action === entry.actions[clip] && (clip === "Attack" || clip === "Shoot")) play("Idle");
  });
}

function layout() {
  const shown = UNITS.filter(u => selection === "group:" + u.group || u.id === selection);
  const portrait = innerWidth < innerHeight;
  // Big groups go in rows (3 across on a phone, 5 on a wide screen), front row nearest the camera.
  const cols = Math.min(shown.length, portrait ? 3 : 5);
  const rows = Math.ceil(shown.length / cols);
  const gapX = 1.3, gapZ = 1.6;
  shown.forEach((u, i) => {
    const e = loaded.get(u.id);
    const r = Math.floor(i / cols), c = i % cols;
    const inRow = Math.min(cols, shown.length - r * cols);  // centre a short last row
    e.root.visible = true;
    e.root.position.set((c - (inRow - 1) / 2) * gapX, 0, ((rows - 1) / 2 - r) * gapZ);
  });
  for (const u of UNITS) if (!shown.includes(u)) loaded.get(u.id).root.visible = false;
  // Fit the grid: wide enough for the columns, tall enough for the figures and the rows behind them.
  const halfV = THREE.MathUtils.degToRad(camera.fov / 2);
  const halfH = Math.atan(Math.tan(halfV) * innerWidth / innerHeight);
  const fitW = (cols * gapX / 2 + 0.2) / Math.tan(halfH);
  const fitH = (2.5 + (rows - 1) * 0.9) / 2 / Math.tan(halfV);
  const dist = Math.max(fitW, fitH, 3.2) * (portrait ? 1.3 : 1.05) + (rows - 1) * gapZ / 2;
  controls.maxDistance = Math.max(12, dist * 1.6);
  // On a phone the chips cover the top of the screen, so aim higher to sit the figures lower.
  controls.target.set(0, portrait ? 1.4 : 1.05, 0);
  camera.position.set(dist * 0.3, 1.5 + rows * 0.5, dist);
  controls.update();
  const u = shown.length === 1 ? shown[0] : null;
  document.getElementById("info").innerHTML = u
    ? `<b>${u.name}</b> · ${u.army} · ${u.side} side — drag to rotate, pinch or scroll to zoom`
    : "Drag to rotate · pinch or scroll to zoom · tap a unit name to inspect it alone";
}

function renderButtons() {
  const units = document.getElementById("units");
  units.innerHTML = "";
  const group = selection.startsWith("group:") ? selection.slice(6) : UNITS.find(u => u.id === selection).group;
  const chips = [...GROUPS.map(g => ["group:" + g, `All ${g.toLowerCase()}`]),
    ...UNITS.filter(u => u.group === group).map(u => [u.id, u.name])];
  for (const [id, label] of chips) {
    const b = document.createElement("button");
    b.textContent = label;
    b.className = selection === id ? "on" : "";
    b.onclick = () => { selection = id; layout(); play(clip === "Death" ? "Idle" : clip); };
    units.append(b);
  }
  const clips = document.getElementById("clips");
  clips.innerHTML = "";
  for (const name of CLIPS) {
    const b = document.createElement("button");
    b.textContent = name;
    b.className = clip === name ? "on" : "";
    b.onclick = () => play(name);
    clips.append(b);
  }
}

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

try {
  const entries = await Promise.all(UNITS.map(load));
  UNITS.forEach((u, i) => { loaded.set(u.id, entries[i]); hookAttackReturn(entries[i]); });
  document.getElementById("loading").remove();
  layout();
  play("Idle");
} catch (err) {
  document.getElementById("loading").textContent = "Could not load units: " + err.message;
}

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 1 / 20);
  for (const e of loaded.values()) e.mixer.update(dt);
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
